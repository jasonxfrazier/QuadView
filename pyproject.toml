[project]
name = "quadview"
version = "0.1.0"
description = "Discover stream links and arrange one to four existing-profile LibreWolf windows on Windows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.56,<2",
    "PySide6>=6.8,<7",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.scripts]
quadview = "quadview.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quadview*"]

